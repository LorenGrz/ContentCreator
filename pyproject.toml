[project]
name = "content-creator"
version = "0.1.0"
description = "Serverless bot that drafts daily Twitter/LinkedIn posts from real GitHub + Google Calendar activity, for manual review via Telegram."
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".aws-sam", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
